/* Layout: one fixed 1600x900 stage, scaled to fit the window. Scenes stack on it and reveal step by step.
   One dark look by choice (navy and orange, matching the CV). */
:root{
  color-scheme:dark;
  --page:#050A16; --navy:#0F1B33; --navy-2:#0A1428; --panel:rgba(255,255,255,.06); --panel-2:rgba(255,255,255,.11); --line:rgba(255,255,255,.14);
  --ink:#0F1B33; --white:#F6F8FD; --mute:#AAB8D4; --mute-2:#7C8BAD;
  --orange:#F57C1F; --orange-2:#FFB26B; --sky:#5AB6F2; --teal:#2CC7B5; --green:#3DDC97; --coral:#FF6B6B; --yellow:#FFC857; --violet:#8D7CFF;
  --display:"Space Grotesk","Inter","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--white);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{height:100%;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#wrap{flex:1;min-height:0;position:relative;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--k,.5));border-radius:26px;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:linear-gradient(155deg,#13213F 0%,#0C1730 46%,#070F20 100%)}
body.shot #app{padding:0;gap:0} body.shot #bar{display:none} body.shot #stage{border-radius:0}

/* ---------- backdrop ---------- */
.bg{position:absolute;inset:0;pointer-events:none}
.glow{position:absolute;left:0;top:0;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;opacity:var(--o,1);
  transform:translate(var(--x,300px),var(--y,100px)) scale(var(--sc,1));transition:transform 2.4s var(--io),opacity 1.6s ease;will-change:transform}
.g1{background:radial-gradient(closest-side,rgba(245,124,31,.24),rgba(245,124,31,.07) 55%,transparent 72%)}
.g2{background:radial-gradient(closest-side,rgba(64,126,255,.30),rgba(64,126,255,.09) 55%,transparent 72%)}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1.1px,transparent 1.3px);background-size:38px 38px;opacity:.5;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 42%,#000 0%,transparent 100%);mask-image:radial-gradient(ellipse 75% 70% at 50% 42%,#000 0%,transparent 100%)}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.3;animation:twinkle 4.5s ease-in-out infinite;animation-delay:var(--fd,0s)}
#prog{position:absolute;left:0;bottom:0;height:5px;width:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .7s var(--out);z-index:50}

/* ---------- scenes and step reveals ---------- */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.04);transition:opacity .5s ease,transform .9s var(--out),visibility 0s .5s}
.scene.past{transform:scale(.96)}
.scene.active{opacity:1;visibility:visible;transform:none;transition:opacity .65s ease .1s,transform 1.1s var(--out) .1s,visibility 0s}
.it{position:absolute;opacity:0;transition:opacity .55s ease var(--d,0s),transform .9s var(--out) var(--d,0s),filter .7s ease var(--d,0s)}
.it svg{display:block}
.it.rise{transform:translateY(38px)}
.it.pop{transform:scale(.35);transition-timing-function:ease,var(--spring),ease}
.it.drop{transform:translateY(-150px);transition-timing-function:ease,var(--spring),ease}
.it.left{transform:translateX(-90px)}
.it.right{transform:translateX(90px)}
.it.zoom{transform:scale(1.2)}
.it.blur{filter:blur(18px);transform:scale(1.07)}
.it.up{transform:translateY(300px);transition-timing-function:ease,var(--spring),ease}
.it.on{opacity:1;transform:none;filter:none}
.it.off{opacity:0;transform:scale(.97);filter:none;transition-duration:.3s,.3s,.3s;transition-delay:0s,0s,0s;pointer-events:none}
.it.on.dim{opacity:.2}
/* children that cascade in after their parent item turns on */
.sg{opacity:0;transform:translateY(20px) scale(.95);transition:opacity .5s ease,transform .75s var(--spring);transition-delay:calc(var(--d,0s) + var(--i,0)*var(--gap,.09s))}
.it.on .sg{opacity:1;transform:none}
.it.off .sg{transition-delay:0s}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.55}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
@keyframes bobble{0%,58%,100%{transform:rotate(0)}7%{transform:rotate(2.6deg)}17%{transform:rotate(-2deg)}27%{transform:rotate(1.4deg)}37%{transform:rotate(-.8deg)}47%{transform:rotate(.35deg)}}
.float{animation:float 5s ease-in-out infinite;animation-delay:var(--fd,0s)}

/* ---------- type ---------- */
.kick{font:800 16px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.title{font:700 58px/1.05 var(--display);letter-spacing:-.022em;color:#fff;margin:16px 0 0;text-wrap:balance}
.cap{font:600 27px/1.35 var(--body);margin:0;text-align:center;color:#fff;text-wrap:balance}
.cap b,.hl{color:var(--orange-2);font-weight:700}
.sub{color:var(--mute)}
.lead{font:500 25px/1.45 var(--body);color:var(--mute);margin:0;text-wrap:pretty}
.lead b{color:#fff;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:999px;font:700 18px/1.2 var(--body);background:var(--panel-2);color:#fff;white-space:nowrap}
.pill.o{background:var(--orange);color:var(--ink)} .pill.s{background:var(--sky);color:var(--ink)} .pill.g{background:var(--green);color:var(--ink)} .pill.c{background:var(--coral);color:var(--ink)}
.pill.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.pill.sm{font-size:15.5px;padding:7px 14px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
.card{background:var(--panel);border-radius:24px;padding:24px 28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.card h3{font:700 28px/1.15 var(--display);letter-spacing:-.01em;margin:0 0 8px;color:#fff}
.card p{font:500 20px/1.42 var(--body);margin:0;color:var(--mute);text-wrap:pretty}
.tile-ic{flex:none;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:rgba(245,124,31,.16);color:var(--orange-2);box-shadow:inset 0 0 0 1px rgba(245,124,31,.35)}
.tile-ic.s{background:rgba(90,182,242,.15);color:var(--sky);box-shadow:inset 0 0 0 1px rgba(90,182,242,.35)}
.tile-ic.g{background:rgba(61,220,151,.14);color:var(--green);box-shadow:inset 0 0 0 1px rgba(61,220,151,.32)}
.hint{display:flex;align-items:center;justify-content:center;gap:10px;font:600 18px/1 var(--body);color:var(--mute);animation:twinkle 2.6s ease-in-out infinite}

/* ---------- the fun avatar (head and body are separate layers, so the head can bobble) ---------- */
.ava{position:relative}
.ava img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
.ava .halo{opacity:.42}
.ava .b,.ava .h{left:0;top:0;width:100%;height:100%}
.ava .h{transform-origin:var(--px,50.7%) var(--py,57.8%);animation:bobble 6.5s ease-in-out infinite;animation-delay:var(--bd,.6s)}
.ava::after{content:"";position:absolute;left:8%;right:8%;bottom:-2.2%;height:5.5%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);z-index:-1}
.ava.flip{transform:scaleX(-1)}

/* ---------- 1 · hello ---------- */
.hello{font:700 156px/.93 var(--display);letter-spacing:-.045em;margin:0;color:#fff}
.hello .w{display:inline-block;opacity:0;transform:translateY(70px) rotate(5deg);transition:opacity .6s ease,transform 1s var(--spring);transition-delay:calc(.2s + var(--i)*.16s)}
.it.on .hello .w{opacity:1;transform:none}
.hello .name{color:var(--orange);position:relative}
.hello .name svg{position:absolute;left:-2%;bottom:-.1em;width:104%;height:.22em;overflow:visible}
.hello .name path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--io) 1.05s}
.it.on .hello .name path{stroke-dashoffset:0}
.role{font:500 31px/1.3 var(--body);color:var(--mute);margin:0;display:flex;align-items:center;gap:16px;white-space:nowrap}
.role i{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.fact{display:flex;align-items:center;gap:12px;padding:12px 20px 12px 12px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);font:600 20px/1 var(--body);white-space:nowrap}
.fact span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(245,124,31,.18);color:var(--orange-2)}
.pro{position:relative;width:520px;height:520px}
.pro::before{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,124,31,.30),transparent 70%);animation:pulse 5s ease-in-out infinite}
.pro img{position:absolute;left:70px;top:70px;width:380px;height:380px;border-radius:50%;object-fit:cover;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 7px rgba(255,255,255,.07)}
.pro svg{position:absolute;inset:0}
.pro .r1{animation:spin 60s linear infinite;transform-origin:0 0}
.pro .r2{animation:spin 11s linear infinite;transform-origin:0 0}
.pro .r3{animation:spin 17s linear infinite reverse;transform-origin:0 0}
.agenda{position:relative;display:flex;justify-content:space-between;width:100%}
.agenda .ln{position:absolute;left:30px;right:30px;top:27px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.agenda .ln i{position:absolute;inset:0;background:linear-gradient(90deg,var(--orange),var(--orange-2));transform:scaleX(0);transform-origin:0 50%;transition:transform 1.5s var(--io) .15s}
.it.on .agenda .ln i{transform:scaleX(1)}
.ag{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:200px;font:600 20px/1.2 var(--body);color:#fff;text-align:center;--gap:.24s}
.ag span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#16284B;color:var(--orange-2);box-shadow:0 0 0 2px var(--orange),0 8px 22px rgba(0,0,0,.35)}

.prochip{width:86px;height:86px;border-radius:50%;padding:4px;background:conic-gradient(from 210deg,var(--orange),var(--orange-2),var(--sky),var(--orange));box-shadow:0 12px 28px rgba(0,0,0,.4)}
.prochip img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #0F1B33}
.prochip.big{width:300px;height:300px;padding:9px;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 70px rgba(245,124,31,.25)}
.prochip.big img{border-width:7px}
/* ---------- 2 · business background ---------- */
.deg{display:flex;align-items:center;gap:14px;font:600 23px/1.2 var(--body);color:var(--mute)}
.deg b{color:#fff;font-weight:700}
.tcard{height:432px;padding:26px 30px 28px;display:flex;flex-direction:column}
.tcard .art{height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.tcard h3{font-size:29px}
.tcard .why{margin-top:auto;display:flex;gap:12px;align-items:flex-start;font:600 19.5px/1.35 var(--body);color:#fff;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.tcard .why svg{flex:none;margin-top:1px;color:var(--green)}
.chain{display:flex;align-items:center}
.chain .n{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;background:#16284B;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
.chain .n.o{background:var(--orange);color:var(--ink);box-shadow:none}
.chain .l{position:relative;width:70px;height:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 7px,transparent 7px 14px)}
.chain .l i{position:absolute;left:0;top:-6px;width:16px;height:16px;border-radius:5px;background:var(--orange-2);animation:flow 1.9s linear infinite;animation-delay:var(--fd,0s)}
@keyframes flow{0%{transform:translateX(-6px);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(60px);opacity:0}}
.bars{display:flex;align-items:flex-end;gap:13px;height:120px;position:relative;padding:0 6px}
.bars i{display:block;width:34px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--orange-2),var(--orange));height:var(--h);transform:scaleY(0);transform-origin:50% 100%;transition:transform .9s var(--spring);transition-delay:calc(.25s + var(--i)*.1s)}
.it.on .bars i{transform:scaleY(1)}
.bars svg{position:absolute;left:0;top:-10px;overflow:visible}
.bars path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--io) .8s}
.it.on .bars path{stroke-dashoffset:0}
.both{font:700 50px/1.1 var(--display);letter-spacing:-.02em;text-align:center;margin:0}
.both em{font-style:normal;color:var(--orange)}

/* ---------- 3 · software engineering ---------- */
.scard{position:relative;overflow:hidden;height:322px;padding:26px 28px}
.scard .wm{position:absolute;right:-34px;bottom:-40px;opacity:.06;pointer-events:none}
.sl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px;position:relative}
.sl li{display:flex;align-items:center;gap:14px;font:600 23.5px/1.2 var(--body);color:#fff}
.sl li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px rgba(245,124,31,.2)}
.scard .top{display:flex;align-items:center;gap:14px;margin-bottom:22px;position:relative}
.scard h3{margin:0;font-size:27px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:8px 15px;border-radius:12px;background:rgba(255,255,255,.09);font:600 18.5px/1.2 var(--body);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.strip{display:flex;align-items:center;gap:18px;padding:18px 26px;border-radius:22px;background:linear-gradient(90deg,rgba(245,124,31,.16),rgba(245,124,31,.04));box-shadow:inset 0 0 0 1px rgba(245,124,31,.3);font:600 23px/1.3 var(--body)}
.veil{width:1600px;height:900px;background:radial-gradient(ellipse 70% 80% at 42% 46%,rgba(7,13,28,.90),rgba(5,9,20,.97))}
.q{font:700 112px/1 var(--display);letter-spacing:-.04em;margin:0}
.q em{font-style:normal;color:var(--orange);display:block}
.q small{display:block;font:600 27px/1.3 var(--body);letter-spacing:0;color:var(--mute);margin-top:30px}

/* ---------- 4 · the technology wheel ---------- */
.spot{width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(190,214,255,.20),rgba(120,160,255,.08) 45%,transparent 70%)}
.ring{position:absolute;width:600px;height:600px;border-radius:50%;color:rgba(255,255,255,.28);transition:transform 1.2s var(--out),color .9s ease,opacity .7s ease}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed currentColor;animation:spin 120s linear infinite}
.ring i{position:absolute;inset:0;animation:spin 9s linear infinite}
.ring.b i{animation-duration:12s;animation-direction:reverse}
.ring i::after{content:"";position:absolute;left:50%;top:-6px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:currentColor;box-shadow:0 0 18px 5px currentColor}
.orbit{position:absolute;width:0;height:0;--R:0px;--O:0}
.orbit .spin{position:absolute;left:0;top:0;width:0;height:0;animation:spin var(--T,70s) linear infinite}
.orbit.rev .spin{animation-direction:reverse}
.orb{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a)) translateX(var(--R));opacity:var(--O);
  transition:transform 1.15s var(--out),opacity .55s ease;transition-delay:calc(var(--i)*.06s)}
.orb .un{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(calc(-1*var(--a)))}
.orb .us{position:absolute;left:0;top:0;width:0;height:0;animation:spin var(--T,70s) linear infinite reverse}
.orb .tw{position:absolute;left:0;top:0;width:0;height:0;transform:scale(var(--ts,1));transition:transform 1.1s var(--out)}
.orbit.rev .us{animation-direction:normal}
.tl{position:absolute;left:-48px;top:-48px;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);
  box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 6px rgba(255,255,255,.09)}
.tl img{width:58px;height:58px;object-fit:contain;display:block}
.tn{position:absolute;left:-90px;top:58px;width:180px;text-align:center;font:700 16.5px/1.15 var(--body);color:#fff;text-shadow:0 2px 10px rgba(5,10,22,.9)}
.wcard{width:500px;padding:22px 26px 24px;transition:box-shadow .6s ease,background .6s ease}
.wcard h3{font-size:30px;margin-top:14px}
.wcard .chips{margin-top:14px}
.wcard .chip{font-size:16.5px;padding:6px 12px}
.it.on .wcard.a{box-shadow:inset 0 0 0 1.5px rgba(245,124,31,.55)}
.it.on .wcard.b{box-shadow:inset 0 0 0 1.5px rgba(90,182,242,.55)}
.sc-wheel .avw{transition:transform 1.1s var(--out)}
.sc-wheel .ring.a{opacity:.55}
.sc-wheel .ring.b{opacity:0}
.sc-wheel.ge1 .ring.a{color:var(--orange);opacity:1}
.sc-wheel.ge1 .oa{--R:300px;--O:1}
.sc-wheel.ge2 .ring.a{opacity:0}
.sc-wheel.ge2 .ring.b{color:var(--sky);opacity:1}
.sc-wheel.ge2 .oa{--R:620px;--O:0}
.sc-wheel.ge2 .ob{--R:300px;--O:1}
.sc-wheel.ge3 .ring.a{opacity:1;transform:scale(1.16)}
.sc-wheel.ge3 .ring.b{transform:scale(.727)}
.sc-wheel.ge3 .oa{--R:348px;--O:1}
.sc-wheel.ge3 .orbit{--ts:.82}
.sc-wheel.ge3 .ob{--R:218px}
.sc-wheel.ge3 .avw{transform:scale(.7)}
.one{font:700 54px/1.05 var(--display);letter-spacing:-.02em;margin:0}
.one small{display:flex;align-items:center;gap:10px;font:600 23px/1.3 var(--body);letter-spacing:0;color:var(--mute);margin-top:12px}

/* ---------- chrome ---------- */
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 13.5px/1 var(--body);color:var(--mute)}
#bar button{font:700 13.5px/1 var(--body);color:var(--white);background:rgba(255,255,255,.10);border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
#bar button:hover{background:var(--orange);color:var(--ink)}
#bar button:focus-visible,#dots button:focus-visible,#stage a:focus-visible{outline:3px solid var(--orange-2);outline-offset:2px}
#bar button[aria-pressed="true"]{background:var(--orange);color:var(--ink)}
#dots{display:flex;gap:6px;flex:1;min-width:120px;justify-content:center;flex-wrap:wrap}
#dots button{width:24px;height:10px;padding:0;border-radius:6px;background:rgba(255,255,255,.14)}
#dots button.cur{background:var(--orange)} #dots button.done{background:var(--mute-2)}
#count{font-variant-numeric:tabular-nums;min-width:160px;text-align:right}
#notes{background:#101D38;border:1px solid var(--line);border-radius:16px;padding:12px 18px;max-height:24vh;overflow:auto}
#notes h4{margin:0 0 5px;font:800 12.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
#notes p{margin:0;font:500 17px/1.5 var(--body);color:var(--white);max-width:95ch}
@media (max-width:900px){#dots button{width:13px}#count{min-width:0}}
@media (prefers-reduced-motion:reduce){
  .it,.sg,.scene,.orb,.ring,.glow,.hello .w{transition-duration:.01s!important;transition-delay:0s!important}
  .float,.star,.hint,.ava .h,.pro::before,.pro .r1,.pro .r2,.pro .r3,.orbit .spin,.orb .us,.ring::before,.ring i,.chain .l i{animation:none!important}
  .fl i,.rjx i,.site .live::before,.hop{animation:none!important}
  .track i,.road i,.stn,.stn .bd,.crow,.crow .cb i,.tw{transition-duration:.01s!important}
}


/* ---------- shared: flow line with a travelling dot, status pills ---------- */
.fl{position:relative;height:4px;flex:none;width:var(--w,70px);background:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 7px,transparent 7px 14px)}
.fl i{position:absolute;left:0;top:-5px;width:14px;height:14px;border-radius:5px;background:var(--orange-2);animation:flw var(--t,1.9s) linear infinite;animation-delay:var(--fd,0s)}
@keyframes flw{0%{transform:translateX(-6px);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(calc(var(--w,70px) - 10px));opacity:0}}
.stt{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font:700 14px/1.2 var(--body);white-space:nowrap;flex:none}
.stt::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.stt.ok{color:var(--green);background:rgba(61,220,151,.12);box-shadow:inset 0 0 0 1px rgba(61,220,151,.3)}
.stt.warn{color:var(--yellow);background:rgba(255,200,87,.12);box-shadow:inset 0 0 0 1px rgba(255,200,87,.3)}
.stt.fail{color:var(--coral);background:rgba(255,107,107,.12);box-shadow:inset 0 0 0 1px rgba(255,107,107,.32)}
.tile-ic.lg{width:66px;height:66px;border-radius:20px}
.tile-ic.sm{width:46px;height:46px;border-radius:14px}
.tech{display:flex;justify-content:flex-end;gap:10px}
.tech .pill img{width:22px;height:22px;object-fit:contain}

/* ---------- 5 · Siemens Energy ---------- */
.pcard{height:372px;padding:28px 30px;display:flex;flex-direction:column}
.pcard .top{display:flex;align-items:center;gap:16px}
.pcard .top small{display:block;font:800 13.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.pcard h3{font-size:32px;margin:0}
.pcard p{margin-top:18px;font-size:21.5px}
.pcard .mini{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.mp{display:flex;align-items:center}
.mp b{padding:8px 13px;border-radius:11px;background:rgba(255,255,255,.1);font:700 16px/1 var(--display);letter-spacing:.02em}
.mp b.o{background:var(--orange);color:var(--ink)}
.mp .g{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--green);flex:none;display:grid;place-items:center;color:var(--green)}

/* ---------- 6 · the pipeline ---------- */
.env{width:200px;height:164px;border-radius:26px;background:#14264A;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transition:box-shadow .6s ease}
.env small{font:700 12.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.env b{font:700 44px/1 var(--display);letter-spacing:-.02em}
.env .ic{color:var(--mute)}
.sc-pipe.ge5 .env.prod{box-shadow:inset 0 0 0 2.5px var(--green),0 0 60px rgba(61,220,151,.35);transition-delay:1.45s}
.track{width:1020px;height:4px;border-radius:2px;position:relative;background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 10px,transparent 10px 20px)}
.track.bad{background:repeating-linear-gradient(90deg,rgba(255,107,107,.6) 0 10px,transparent 10px 20px)}
.track i{position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--orange-2));transform-origin:0 50%;transform:scaleX(var(--tp,0));transition:transform 1.15s var(--io) .35s}
.sc-pipe.ge2 .track i{--tp:.2255} .sc-pipe.ge3 .track i{--tp:.4902} .sc-pipe.ge4 .track i{--tp:.7549} .sc-pipe.ge5 .track i{--tp:1}
.lockb{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:#2A1522;color:var(--coral);box-shadow:inset 0 0 0 2.5px var(--coral),0 0 50px rgba(255,107,107,.3)}
.lockt{margin:0;text-align:center;font:700 23px/1.25 var(--display);color:var(--coral)}
.stn{position:relative;width:116px;height:116px;border-radius:50%;background:#14264A;display:grid;place-items:center;color:var(--mute);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 14px 34px rgba(0,0,0,.35);transition:box-shadow .5s ease,color .5s ease;transition-delay:0s}
.stn .spin{position:absolute;inset:-10px;border-radius:50%;border:3.5px solid transparent;border-top-color:var(--orange);border-right-color:var(--orange-2);opacity:0}
.stn .bd{position:absolute;right:-3px;top:-3px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transform:scale(0);transition:transform .5s var(--spring)}
.stn .bd.ok{background:var(--green)} .stn .bd.no{background:var(--coral)}
@keyframes proc{0%{opacity:0;transform:rotate(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:rotate(540deg)}}
.st3{--dl:3.15s}
.sc-pipe.ge2 .st1 .spin,.sc-pipe.ge3 .st2 .spin{animation:proc .95s linear 1.5s 1 both}
.sc-pipe.ge4 .st3 .spin{animation:proc 1.7s linear 1.5s 1 both}
.sc-pipe.ge2 .st1,.sc-pipe.ge3 .st2,.sc-pipe.ge4 .st3{color:var(--green);box-shadow:inset 0 0 0 2.5px var(--green),0 0 44px rgba(61,220,151,.28);transition-delay:var(--dl,2.4s)}
.sc-pipe.ge2 .st1 .bd.ok,.sc-pipe.ge3 .st2 .bd.ok,.sc-pipe.ge4 .st3 .bd.ok{transform:scale(1);transition-delay:var(--dl,2.4s)}
.sc-pipe.ge6:not(.ge7) .st1{color:var(--coral);box-shadow:inset 0 0 0 2.5px var(--coral),0 0 44px rgba(255,107,107,.35);transition-delay:1.75s}
.sc-pipe.ge6:not(.ge7) .st1 .bd.ok{transform:scale(0);transition-delay:1.55s}
.sc-pipe.ge6:not(.ge7) .st1 .bd.no{transform:scale(1);transition-delay:1.75s}
.stl{text-align:center}
.stl b{display:block;font:700 22px/1.2 var(--display)}
.stl span{display:block;font:500 16.5px/1.35 var(--body);color:var(--mute);margin-top:5px}
.pkg{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,var(--orange-2),var(--orange));color:var(--ink);box-shadow:0 12px 30px rgba(245,124,31,.45),0 0 0 6px rgba(245,124,31,.18)}
.pkg.bad{background:linear-gradient(145deg,#FFA3A3,var(--coral));box-shadow:0 12px 30px rgba(255,107,107,.45),0 0 0 6px rgba(255,107,107,.18)}
.it.trav{transition:opacity .35s ease,transform 1.15s var(--io) .35s}

/* ---------- 12 · what's next ---------- */
.road{width:1420px;height:6px;border-radius:3px;position:relative;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 14px,transparent 14px 28px)}
.road i{position:absolute;inset:0;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--orange-2));transform-origin:0 50%;transform:scaleX(var(--rp,.148));transition:transform 1.05s var(--io)}
.sc-next.ge1 .road i{--rp:.5} .sc-next.ge2 .road i{--rp:.852} .sc-next.ge3 .road i{--rp:1}
.ms{width:30px;height:30px;border-radius:50%;background:#14264A;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3);transition:background .4s ease,box-shadow .4s ease}
.sc-next .m1,.sc-next.ge1 .m2,.sc-next.ge2 .m3{background:var(--orange);box-shadow:0 0 0 7px rgba(245,124,31,.22),0 0 30px rgba(245,124,31,.6)}
.sc-next.ge1 .m2,.sc-next.ge2 .m3{transition-delay:.9s}
.ncard{height:204px;padding:20px 24px}
.ncard em{display:block;font:600 15px/1 var(--body);font-style:normal;color:var(--mute-2);margin:4px 0 6px}
.ncard ul{list-style:none;margin:0;padding:0}
.ncard li{display:flex;align-items:center;gap:10px;font:600 17.5px/1.5 var(--body);color:#fff}
.ncard li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.ncard small{display:block;font:800 13px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:11px}
.ncard h3{font-size:27px;margin:0 0 6px}
.ncard p{font-size:19px}
.it.trav3{transition:opacity .4s ease,transform 1.05s var(--io)}
@keyframes hopA{0%,100%{transform:translateY(0)}50%{transform:translateY(-52px)}}
@keyframes hopB{0%,100%{transform:translateY(0)}50%{transform:translateY(-52px)}}
@keyframes hopC{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px)}}
.sc-next.ge1 .hop{animation:hopA 1.05s ease-in-out 1}
.sc-next.ge2 .hop{animation:hopB 1.05s ease-in-out 1}
.sc-next.ge3 .hop{animation:hopC .7s ease-in-out .5s 1}
.flagb{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--orange);box-shadow:0 0 0 8px rgba(245,124,31,.2),0 0 40px rgba(245,124,31,.5)}
.bring{display:flex;align-items:center;gap:14px}
.bring .lb{font:800 14px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-right:8px;white-space:nowrap}
.bring .pill{font-size:20px;padding:13px 20px;gap:10px}

/* ---------- 13 · close ---------- */
.thanks{font:700 150px/.95 var(--display);letter-spacing:-.045em;margin:0}
.thanks em{font-style:normal;color:var(--orange)}
.cts{display:flex;flex-wrap:wrap;gap:14px;max-width:880px}
.ct{display:flex;align-items:center;gap:14px;padding:9px 22px 9px 9px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:600 21px/1 var(--body);color:#fff;text-decoration:none;transition:background .25s ease,box-shadow .25s ease}
a.ct:hover{background:rgba(245,124,31,.16);box-shadow:inset 0 0 0 1.5px var(--orange)}
.ct>span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(245,124,31,.18);color:var(--orange-2)}
.ct small{font:600 14px/1 var(--body);color:var(--mute-2);margin-left:2px}
.say{position:relative;padding:16px 28px;border-radius:26px;background:#fff;color:var(--ink);font:700 36px/1 var(--display);box-shadow:0 20px 44px rgba(0,0,0,.4)}
.say::after{content:"";position:absolute;right:46px;bottom:-12px;width:28px;height:28px;background:#fff;transform:rotate(45deg);border-radius:4px}
.foot{font:600 16px/1 var(--body);letter-spacing:.04em;color:var(--mute-2)}


</style>
</head>

  </div>
</div>

   'What I bring: I understand the business side, I have real enterprise experience with Power Platform, and I learn by building: I build something, then I improve it and optimise it.']});})();

/* ===== 14 · Close ===== */
(()=>{let h='';
  h+=I(1000,170,proBig(),{cls:'pop',d:.2,w:520,h:520});
  h+=I(978,146,`<div class="say">Tusind tak!</div>`,{cls:'pop',d:1.2,z:3});
  h+=T(112,150,800,`<div class="kick">My story so far</div>`,{cls:'left'});
  h+=T(104,186,900,`<h2 class="thanks">Thank <em>you.</em></h2>`,{cls:'blur',d:.15});
  h+=T(112,368,860,`<p class="lead" style="font-size:30px">I would love to show you more. <b>Let's talk.</b></p>`,{d:.6});
  const CT=[['mail','ildo.mota@hotmail.com','mailto:ildo.mota@hotmail.com'],['phone','+45 55 25 59 79','tel:+4555255979'],['globe','ildomota.github.io','https://ildomota.github.io','Portfolio'],['code-xml','github.com/ildomota','https://github.com/ildomota','GitHub'],['briefcase-business','LinkedIn','https://www.linkedin.com/in/ildo-mota-32a39b21b/']];
  h+=T(112,456,900,`<div class="cts">${CT.map((c,i)=>`<span class="sg" style="--i:${i};--d:.95s;--gap:.1s"><a class="ct" href="${c[2]}" target="_blank" rel="noopener"><span>${ic(c[0],21)}</span>${c[1]}${c[3]?`<small>${c[3]}</small>`:''}</a></span>`).join('')}</div>`,{cls:'fade'});
  h+=T(112,800,900,`<div class="foot">Ildo Mota · Software Engineering Student · Power Platform Developer</div>`,{cls:'fade',d:1.6});
  S.push({name:'Thank you',steps:0,html:h,mood:{g1:[1280,520,1.2],g2:[200,200,1.1]},notes:[
   'That was me. Thank you for your time. I would love to show you more, so let\'s talk. You can find my portfolio, with all of these projects, at ildomota.github.io.']});})();


/* ---------- build the stage ---------- */
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
let stars='';for(let i=0;i<54;i++){const s=1.5+rnd()*2.6;stars+=`<i class="star" style="left:${(rnd()*1600).toFixed(0)}px;top:${(rnd()*900).toFixed(0)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;--fd:${(rnd()*4.5).toFixed(2)}s"></i>`;}
stage.innerHTML=`<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="grain"></div>${stars}</div>`+
  S.map(s=>`<section class="scene ${s.cls||''}" aria-label="${s.name}">${s.html}</section>`).join('')+`<div id="prog"></div>`;
const scenes=[...stage.querySelectorAll('.scene')],g1=stage.querySelector('.g1'),g2=stage.querySelector('.g2'),prog=document.getElementById('prog');
const dots=document.getElementById('dots');
dots.innerHTML=S.map((s,i)=>`<button type="button" role="tab" aria-label="Scene ${i+1}: ${s.name}" title="${i+1}. ${s.name}"></button>`).join('');
const dotB=[...dots.children],count=document.getElementById('count'),notes=document.getElementById('notes'),notesH=document.getElementById('notes-h'),notesP=document.getElementById('notes-p');
document.getElementById('b-prev').innerHTML=ic('arrow-left',14)+'<span style="margin-left:6px">Back</span>';
document.getElementById('b-next').innerHTML='<span style="margin-right:6px">Next</span>'+ic('arrow-right',14);
document.querySelectorAll('#bar button').forEach(b=>{b.style.display='inline-flex';b.style.alignItems='center';});
const total=S.reduce((n,s)=>n+s.steps+1,0);
let si=0,st=0;

/* ---------- effects that play when an item turns on: counting numbers and typed text ---------- */
function num(v,n){const dec=+(n.dataset.dec||0);const p=v.toFixed(dec).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,n.dataset.ts===undefined?',':n.dataset.ts);return (n.dataset.pre||'')+p.join(n.dataset.dc||'.')+(n.dataset.suf||'');}
function fxOn(el){
  const inner=n=>{const a=n.closest('[data-at]');return a&&a!==el;}; // counters with their own start step wait for it
  el.querySelectorAll('[data-count]').forEach(n=>{if(inner(n))return;const to=+n.dataset.count,from=+(n.dataset.from||0),dur=+(n.dataset.dur||1500),del=+(n.dataset.delay||0);
    cancelAnimationFrame(n._r);clearTimeout(n._t);n.textContent=num(from,n);
    n._t=setTimeout(()=>{const t0=performance.now();(function tick(t){const p=Math.min(1,Math.max(0,(t-t0)/dur)),e=1-Math.pow(1-p,3);n.textContent=num(from+(to-from)*e,n);if(p<1)n._r=requestAnimationFrame(tick);})(t0);},del);});
  el.querySelectorAll('[data-type]').forEach(n=>{const full=n.dataset.type,sp=+(n.dataset.speed||34),del=+(n.dataset.delay||0);clearTimeout(n._t);n.textContent='';let i=0;
    const step=()=>{i++;n.textContent=full.slice(0,i);if(i<full.length)n._t=setTimeout(step,sp);};n._t=setTimeout(step,del);});
}
function fxOff(el){
  el.querySelectorAll('[data-count]').forEach(n=>{cancelAnimationFrame(n._r);clearTimeout(n._t);n.textContent=num(+(n.dataset.from||0),n);});
  el.querySelectorAll('[data-type]').forEach(n=>{clearTimeout(n._t);n.textContent='';});
}
function setGlow(el,v){el.style.setProperty('--x',v[0]+'px');el.style.setProperty('--y',v[1]+'px');el.style.setProperty('--sc',v[2]===undefined?1:v[2]);el.style.setProperty('--o',v[3]===undefined?1:v[3]);}

/* ---------- show the current scene and step ---------- */
function paint(){
  scenes.forEach((sc,i)=>{sc.classList.toggle('active',i===si);sc.classList.toggle('past',i<si);});
  const sc=scenes[si],cfg=S[si];
  for(let n=0;n<=12;n++)sc.classList.toggle('ge'+n,st>=n);
  sc.dataset.st=st;
  sc.querySelectorAll('[data-s]').forEach(el=>{
    const s=+el.dataset.s,u=el.dataset.u===undefined?99:+el.dataset.u,on=st>=s&&st<=u,was=el.classList.contains('on');
    el.classList.toggle('on',on);el.classList.toggle('off',st>u);
    if(el.dataset.dim!==undefined){const d=el.dataset.dim.split('-');el.classList.toggle('dim',st>=+d[0]&&st<=(d[1]===undefined||d[1]===''?99:+d[1]));}
    if(el.dataset.k){const k=JSON.parse(el.dataset.k);let best=null;for(const key in k)if(+key<=st&&(best===null||+key>+best))best=key;el.style.transform=best===null?'':k[best];}
    if(on&&!was)fxOn(el);else if(!on&&was)fxOff(el);
  });
  sc.querySelectorAll('[data-at]').forEach(el=>{const on=st>=+el.dataset.at;if(on!==!!el._on){el._on=on;if(on)fxOn(el);else fxOff(el);}});
  const m=cfg.mood||{};setGlow(g1,m.g1||[1250,260,1,1]);setGlow(g2,m.g2||[250,760,1,1]);
  let done=st;for(let i=0;i<si;i++)done+=S[i].steps+1;
  prog.style.setProperty('--p',(done/Math.max(1,total-1)).toFixed(4));
  dotB.forEach((b,i)=>{b.classList.toggle('cur',i===si);b.classList.toggle('done',i<si);b.setAttribute('aria-selected',i===si);});
  count.textContent=`Scene ${si+1} / ${S.length}  ·  step ${st} / ${cfg.steps}`;
  notesH.textContent=`Notes · ${si+1}. ${cfg.name}`;notesP.textContent=cfg.notes[st]||'';
  try{history.replaceState(null,'','#s'+(si+1)+'-'+st);}catch(e){}
}
function go(i,step){ // enter a scene with its items reset, so the reveals animate in
  if(i!==si||step===0){const sc=scenes[i];sc.querySelectorAll('.on,.off').forEach(el=>{el.classList.remove('on','off');fxOff(el);});sc.querySelectorAll('[data-at]').forEach(el=>{el._on=false;fxOff(el);});for(let n=0;n<=12;n++)sc.classList.remove('ge'+n);void sc.offsetWidth;}
  si=i;st=step;requestAnimationFrame(paint);
}
function next(){if(st<S[si].steps){st++;paint();}else if(si<S.length-1)go(si+1,0);}
function prev(){if(st>0){st--;paint();}else if(si>0){si--;st=S[si].steps;paint();}}
function fit(){const k=Math.min(wrap.clientWidth/1600,wrap.clientHeight/900);stage.style.setProperty('--k',Math.max(.05,k).toFixed(4));}
function toggleNotes(){notes.hidden=!notes.hidden;document.getElementById('b-notes').setAttribute('aria-pressed',String(!notes.hidden));fit();}
function full(){const el=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}}

let swiped=false,tx=null;
wrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
wrap.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60){swiped=true;if(dx<0)next();else prev();setTimeout(()=>{swiped=false;},450);}},{passive:true});
wrap.addEventListener('click',e=>{if(swiped||e.target.closest('a,button'))return;next();});
document.getElementById('b-next').addEventListener('click',next);
document.getElementById('b-prev').addEventListener('click',prev);
document.getElementById('b-notes').addEventListener('click',toggleNotes);
document.getElementById('b-full').addEventListener('click',full);
dotB.forEach((b,i)=>b.addEventListener('click',()=>go(i,0)));
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){if(k!=='Enter'&&k!==' '||!e.target.closest('button,a')){e.preventDefault();next();}}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
  else if(k==='Home'){go(0,0);}else if(k==='End'){go(S.length-1,0);}
  else if(k==='n'||k==='N'){toggleNotes();}else if(k==='f'||k==='F'){full();}
});
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(wrap);

/* a link such as #s6-2 opens scene 6 at step 2 */
function fromHash(){const m=/^#s(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!m)return null;const i=Math.min(S.length,Math.max(1,+m[1]))-1;return {si:i,st:Math.min(S[i].steps,+(m[2]||0))};}
window.addEventListener('hashchange',()=>{const h=fromHash();if(h&&(h.si!==si||h.st!==st))go(h.si,h.st);});
if(/[?&]shot\b/.test(location.search))document.body.classList.add('shot');

const hot=window.claude&&window.claude.hot;
function start(d){fit();si=Math.min(S.length-1,Math.max(0,(d&&d.si)|0));st=Math.min(S[si].steps,Math.max(0,(d&&d.st)|0));
  requestAnimationFrame(()=>requestAnimationFrame(paint));}
if(hot&&hot.snapshot)hot.snapshot(()=>({si,st}));
const first=fromHash();
if(first)start(first);else if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
window.__deck={go,next,prev,S};
})();


</script>
