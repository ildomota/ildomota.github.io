<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ppTitle">
  <title id="ppTitle">Power Platform deployment pipeline illustration</title>
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1f" />
      <stop offset="0.55" stop-color="#0d1430" />
      <stop offset="1" stop-color="#19123a" />
    </linearGradient>
    <radialGradient id="pp-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.85" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pp-glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pp-glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.75" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pp-flow-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="0.5" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="pp-soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36" />
    </filter>
    <filter id="pp-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#pp-bg)" />

  <g filter="url(#pp-soften)">
    <circle cx="110" cy="90" r="150" fill="url(#pp-glow-blue)" />
    <circle cx="700" cy="110" r="130" fill="url(#pp-glow-teal)" />
    <circle cx="640" cy="380" r="190" fill="url(#pp-glow-violet)" />
  </g>

  <g stroke="url(#pp-flow-line)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M240 225 H322" />
    <path d="M465 225 H547" />
  </g>
  <g fill="#2dd4bf">
    <path d="M335 225 L322 217 L322 233 Z" />
    <path d="M560 225 L547 217 L547 233 Z" />
  </g>
  <g fill="#e2e8f0" filter="url(#pp-soft-glow)">
    <circle cx="281" cy="225" r="4.5" />
    <circle cx="506" cy="225" r="4.5" />
  </g>

  <!-- DEV node -->
  <g>
    <rect x="110" y="180" width="130" height="90" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="175" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" letter-spacing="2" fill="#93a4c3" font-weight="600">DEV</text>
    <path d="M162 232 L148 245 L162 258 M188 232 L202 245 L188 258" stroke="#cbd5f5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- APPROVAL node -->
  <g>
    <rect x="335" y="155" width="130" height="140" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="400" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14" letter-spacing="1.5" fill="#5eead4" font-weight="700">APPROVAL</text>
    <circle cx="400" cy="236" r="32" fill="#0f766e" fill-opacity="0.35" stroke="#2dd4bf" stroke-width="2.5" />
    <path d="M386 237 L397 248 L416 223" stroke="#ecfeff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- PROD node -->
  <g>
    <rect x="560" y="180" width="130" height="90" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="625" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" letter-spacing="2" fill="#bcd2ff" font-weight="600">PROD</text>
    <rect x="602" y="229" width="46" height="11" rx="3" fill="none" stroke="#cbd5f5" stroke-width="2.5" />
    <rect x="602" y="245" width="46" height="11" rx="3" fill="none" stroke="#cbd5f5" stroke-width="2.5" />
    <circle cx="610" cy="234.5" r="1.8" fill="#5eead4" />
    <circle cx="610" cy="250.5" r="1.8" fill="#5eead4" />
  </g>

  <text x="400" y="332" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" letter-spacing="3" fill="#ffffff" fill-opacity="0.35" font-weight="600">POWER PLATFORM · DEPLOYMENT PIPELINE</text>
</svg>
